<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- KHÔNG đặt maximum-scale/user-scalable=no: chặn phóng to là trượt WCAG 1.4.4, và
         với app tiền thì người dùng cần soi con số. Lý do khoá ban đầu là chặn iOS Safari
         tự phóng khi focus ô nhập — nhưng nguyên nhân đó đã xử ở gốc trong src/index.css
         (@media max-width:1023px buộc input/select/textarea ≥16px), nên không cần khoá nữa.
         Nút Cài đặt → Cỡ chữ vẫn giữ, giờ là tiện thêm chứ không còn là đường thoát duy nhất. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- IBM Plex Sans (chữ) + IBM Plex Mono (mọi con số) — kiểu chữ của bản redesign 1a.
         Khai vào --font-sans/--font-mono ở src/index.css; ở đây chỉ nạp file.
         · preconnect tách làm hai: css2 nằm ở fonts.googleapis.com, file .woff2 ở
           fonts.gstatic.com (khác origin, cần crossorigin vì font tải theo CORS).
         · KHÔNG chốt `subset=`: app viết tiếng Việt, cần subset `vietnamese`
           (U+1EA0-1EF9 cho dấu nặng/hỏi, và ₫ U+20AB). css2 chia @font-face theo
           unicode-range nên để mặc định không tốn thêm byte — trình duyệt chỉ tải
           subset nó thật sự gặp.
         · display=swap: chữ hiện ngay bằng font hệ thống rồi đổi, không có màn trắng.
           Đổi font làm chữ nhảy một nhịp; chấp nhận được vì thà thấy số sớm.
         · Offline: font nằm ở CDN nên không vào precache của PWA. Có luật
           runtimeCaching riêng trong vite.config.ts để lần mở sau vẫn có font. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    />
    <meta name="theme-color" content="#008236" />
    <!-- Mở toàn màn hình như app thật khi thêm vào Màn hình chính (iPhone) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Sổ Gạo" />
    <title>Sổ Gạo</title>
    <script>
      // Áp giao diện Sáng/Tối ngay trước khi vẽ để tránh nhấp nháy màu sai
      ;(function () {
        try {
          var p = localStorage.getItem('theme') || 'system'
          var dark =
            p === 'dark' ||
            (p === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) {
            document.documentElement.classList.add('dark')
            var m = document.querySelector('meta[name="theme-color"]')
            // = --surface-page của thang 1a. Phải viết trần: script này chạy TRƯỚC khi
            // CSS nạp, mà thanh trạng thái trình duyệt lấy màu từ chính thuộc tính này.
            if (m) m.setAttribute('content', '#08090b')
          }
        } catch (e) {}
      })()

      // Áp cỡ chữ đã lưu ngay trước khi vẽ để tránh nhảy layout
      ;(function () {
        try {
          var s = { sm: 0.9, md: 1, lg: 1.1, xl: 1.25 }[localStorage.getItem('font-scale')]
          if (s) document.documentElement.style.setProperty('--app-font-scale', String(s))
        } catch (e) {}
      })()

      // Chặn chụm/xòe 2 ngón để phóng to trên iPhone (Safari bỏ qua user-scalable)
      ;(function () {
        try {
          document.addEventListener(
            'gesturestart',
            function (e) {
              e.preventDefault()
            },
            { passive: false },
          )
          document.addEventListener(
            'gesturechange',
            function (e) {
              e.preventDefault()
            },
            { passive: false },
          )
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
